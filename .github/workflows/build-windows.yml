name: Build & Release Windows Installer

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags: v1.0.0, v1.0.1, etc.
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout desktop-app
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Checkout frontend source
        uses: actions/checkout@v4
        with:
          repository: khoiron81/pos-erp-frontend
          path: frontend-src
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Install desktop dependencies
        run: npm ci

      - name: Build frontend static export
        if: hashFiles('frontend-src/package.json') != ''
        run: |
          cd frontend-src
          npm ci
          $env:NEXT_PUBLIC_DESKTOP = "true"
          npx next build
          Copy-Item -Recurse -Force out/* ../renderer/

      - name: Compile TypeScript
        run: npx tsc -p tsconfig.json

      - name: Build Windows Installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: POS-ERP-UMKM-Windows-Installer
          path: |
            release/*.exe
            release/*.yml
          retention-days: 30

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: POS-ERP-UMKM-Windows-Installer
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.yml
          body: |
            ## POS ERP UMKM - Desktop App
            
            ### Download & Install
            1. Download `POS-ERP-UMKM-*-Setup.exe`
            2. Run the installer
            3. Follow the installation wizard
            
            ### What's New
            - See commit history for changes
          draft: false
          prerelease: false
