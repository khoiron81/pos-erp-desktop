appId: co.id.aktech.pos-erp
productName: POS ERP UMKM
copyright: Copyright © 2026 PT. Aktech Digital Solutions

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - renderer/**/*
  - "!node_modules/**/*"
  # electron-store and its transitive dependencies
  - node_modules/electron-store/**/*
  - node_modules/conf/**/*
  - node_modules/type-fest/**/*
  - node_modules/ajv/**/*
  - node_modules/ajv-formats/**/*
  - node_modules/atomically/**/*
  - node_modules/debounce-fn/**/*
  - node_modules/dot-prop/**/*
  - node_modules/env-paths/**/*
  - node_modules/json-schema-typed/**/*
  - node_modules/onetime/**/*
  - node_modules/pkg-up/**/*
  - node_modules/semver/**/*
  - node_modules/mimic-fn/**/*
  - node_modules/find-up/**/*
  - node_modules/locate-path/**/*
  - node_modules/p-locate/**/*
  - node_modules/p-limit/**/*
  - node_modules/path-exists/**/*
  - node_modules/fast-deep-equal/**/*
  - node_modules/json-schema-traverse/**/*
  - node_modules/uri-js/**/*
  - node_modules/require-from-string/**/*
  - node_modules/is-obj/**/*
  # electron-updater
  - node_modules/electron-updater/**/*

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  artifactName: POS-ERP-UMKM-${version}-Setup.${ext}

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  shortcutName: POS ERP UMKM
  createDesktopShortcut: always
  createStartMenuShortcut: true

publish:
  provider: github
  owner: AktechDigitalSolutions
  repo: pos-erp-desktop
  releaseType: release
